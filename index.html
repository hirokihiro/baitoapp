<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BAITOAPP - はじめる</title>
  <link rel="stylesheet" href="./css/start-screen.css" />
</head>
<body class="start-screen">
  <div class="start-hero">
    <div class="start-top">
      <a class="start-skip" href="./login.html">スキップ</a>
    </div>

    <div class="start-brand">
      <h1>BAITOAPP</h1>
      <p>自分に合う働き方を、すぐに見つけよう。</p>
    </div>
  </div>

  <section class="start-sheet" aria-label="はじめ方を選ぶ">
    <p class="start-callout">会員登録をして、すぐにはじめましょう！</p>

    <div class="start-choices">
      <a class="start-choice start-choice-primary" href="./register.html?role=user">
        <span>お客様として</span>
        <strong>はじめる</strong>
      </a>

      <a class="start-choice start-choice-secondary" href="./register.html?role=admin">
        <span>掲載者として</span>
        <strong>登録する</strong>
      </a>
    </div>

    <p class="start-login">
      すでにアカウントをお持ちの方は
      <a href="./login.html">ログイン</a>
    </p>
  </section>

  <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-relevant="additions"></div>
  <div id="msg" class="start-msg" aria-live="polite"></div>

  <script type="module" src="./js/main-start.js"></script>
</body>
</html>
